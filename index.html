<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Office Life — a Stardew-style pixel game set on an IT development floor.">
<meta name="theme-color" content="#1d1820">
<title>Office Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: full-bleed pixel canvas with a camera that follows the player; wood-framed HUD and dialogue float on top */
:root{
  --ground:#1d1820;
  --wood-dark:#5c2e14;
  --wood:#8a4b22;
  --wood-light:#d4893f;
  --parchment:#f8e1ae;
  --parchment-2:#ebc583;
  --ink:#3a2316;
  --muted:#8a5a34;
  --focus:#4fb37a;
  --font-ui:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--ground)}
#view{position:absolute;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated}

.frame{
  background:linear-gradient(var(--parchment),var(--parchment-2));
  border:3px solid var(--wood);
  border-radius:4px;
  box-shadow:0 0 0 3px var(--wood-light),0 0 0 6px var(--wood-dark),0 8px 0 6px rgba(0,0,0,.35);
}

#hud{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));
  padding:6px 12px 8px;min-width:148px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.hud-row{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:600}
.hud-row .muted{color:var(--muted);font-weight:400}
.hud-time{font-size:24px;font-weight:700;line-height:1.05;text-align:center;border-block:2px solid rgba(138,75,34,.35);padding-block:2px}
.focus{display:flex;align-items:center;gap:8px;font-size:14px}
.bar{flex:1;height:9px;background:#5c2e14;border:2px solid var(--wood-dark);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--focus);box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:width .3s}
.quest{color:#2f6239}
.hud-ver{font-size:12px;color:var(--muted);text-align:right;border-top:1px solid rgba(138,75,34,.3);padding-top:2px;letter-spacing:.04em}
.fade-ver{margin:0;font-size:13px;color:#b08a64;letter-spacing:.06em}
.quest.done{color:#4f8f3a}

/* start screen, sitcom captions and title card */
#start{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#1b1530}
#city{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
#playBtn{position:relative}
#playBtn{display:inline-flex;align-items:center;gap:16px;font:700 34px var(--font-ui);color:var(--parchment);
  background:#4f8f3a;border:4px solid #2c5420;border-radius:8px;padding:16px 40px 16px 32px;cursor:pointer;
  box-shadow:0 0 0 4px #8cc46a,0 10px 0 #2c5420,0 16px 30px rgba(0,0,0,.45)}
#playBtn::before{content:"";width:0;height:0;border-left:22px solid var(--parchment);border-top:14px solid transparent;border-bottom:14px solid transparent}
#playBtn:hover{background:#5aa043}
#playBtn:active{transform:translateY(4px);box-shadow:0 0 0 4px #8cc46a,0 6px 0 #2c5420,0 10px 20px rgba(0,0,0,.45)}
#playBtn:focus-visible{outline:4px solid var(--parchment);outline-offset:6px}
#game.intro #hud,#game.intro #hint,#game.intro #pad{display:none}
#caption{position:absolute;left:max(28px,env(safe-area-inset-left,0px));bottom:calc(48px + env(safe-area-inset-bottom,0px));
  display:grid;gap:2px;transform:rotate(-4deg);transform-origin:left bottom;pointer-events:none;animation:capIn .35s cubic-bezier(.2,1.4,.4,1) both}
.cap-kicker{font:700 16px var(--font-ui);color:#ffffff;text-transform:uppercase;letter-spacing:.2em;text-shadow:2px 2px 0 #2a1d24}
.cap-name{font-family:"Bungee","Pixelify Sans",sans-serif;font-size:clamp(30px,7vw,58px);line-height:1;color:#fff3b0;
  text-shadow:3px 3px 0 #d4572a,6px 6px 0 #2a1d24}
.cap-role{font:600 clamp(16px,3.4vw,22px) var(--font-ui);color:#ffffff;text-shadow:2px 2px 0 #2a1d24}
@keyframes capIn{from{transform:translateX(-120%) rotate(-4deg)}to{transform:translateX(0) rotate(-4deg)}}
#titlecard{position:absolute;inset:0;z-index:15;display:grid;place-content:center;justify-items:center;gap:22px;cursor:pointer;
  background:radial-gradient(ellipse at center,rgba(29,24,32,.35),rgba(29,24,32,.85));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.tc-logo{display:grid;justify-items:center;line-height:.9;transform:rotate(-5deg);animation:tcPop .6s cubic-bezier(.2,1.6,.4,1) both}
.tc-logo span{font-family:"Bungee","Pixelify Sans",sans-serif;font-size:clamp(56px,15vw,150px);color:#fff3b0;
  text-shadow:4px 4px 0 #e2408f,8px 8px 0 #2fb8c9,12px 12px 0 #2a1d24}
.tc-logo span+span{color:#ffd24a;margin-left:.6em}
.tc-click{margin:0;font:700 clamp(18px,4vw,26px) var(--font-ui);color:#ffffff;text-shadow:2px 2px 0 #2a1d24;animation:blink 1.1s steps(2) infinite}
.tc-credit{margin:0;font:600 clamp(14px,3vw,18px) var(--font-ui);color:#f8e1ae;text-shadow:2px 2px 0 #2a1d24;text-align:center}
@keyframes tcPop{from{transform:scale(.2) rotate(-25deg);opacity:0}to{transform:scale(1) rotate(-5deg);opacity:1}}
@keyframes blink{50%{opacity:.25}}
#skip{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));top:calc(18px + env(safe-area-inset-top,0px));z-index:16;
  font:700 18px var(--font-ui);color:var(--ink);background:linear-gradient(var(--parchment),var(--parchment-2));
  border:3px solid var(--wood);border-radius:4px;padding:8px 16px;cursor:pointer;
  box-shadow:0 0 0 3px var(--wood-light),0 0 0 6px var(--wood-dark),0 6px 0 6px rgba(0,0,0,.35)}
#skip:hover{filter:brightness(1.06)}
#skip:focus-visible{outline:2px solid var(--parchment);outline-offset:3px}
@media (prefers-reduced-motion:reduce){#caption,.tc-logo,.tc-click{animation:none}}
#hint{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));
  padding:6px 12px;font-size:15px;max-width:min(330px,calc(100% - 230px));line-height:1.3;transition:opacity .6s}
#hint b{font-weight:700}
#hint.gone{opacity:0;pointer-events:none}

#dlg{position:absolute;left:0;right:0;margin-inline:auto;width:min(900px,calc(100% - 40px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;align-items:stretch;cursor:pointer}
.touch #dlg{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.dlg-text{flex:1;min-width:0;min-height:128px;padding:14px 20px 26px;position:relative}
.dlg-text p{margin:0;font-size:21px;line-height:1.4;color:var(--ink)}
.dlg-next{position:absolute;right:14px;bottom:8px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--wood);animation:nudge .7s steps(2) infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.choices{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.choice{font:inherit;font-size:19px;text-align:left;background:transparent;border:0;border-radius:3px;padding:3px 10px 3px 26px;color:var(--ink);cursor:pointer;position:relative}
.choice:hover,.choice.sel{background:rgba(138,75,34,.16)}
.choice.sel::before{content:"";position:absolute;left:8px;top:50%;margin-top:-5px;border-left:9px solid var(--wood);border-top:5px solid transparent;border-bottom:5px solid transparent}
.choice:focus-visible{outline:2px solid var(--wood)}
.dlg-port{flex:0 0 auto;width:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
#portrait{width:120px;height:120px;image-rendering:pixelated;background:linear-gradient(#e0a868,#c98848);border:3px solid var(--wood);border-radius:2px}
.nameplate{background:var(--parchment);border:2px solid var(--wood);border-radius:3px;padding:1px 12px;font-weight:700;font-size:17px;text-align:center}
.role{font-size:13px;color:var(--muted);text-align:center;line-height:1.15}

#fade{position:absolute;inset:0;background:#ffffff;display:grid;place-content:center;text-align:center;gap:6px;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.fade-day{margin:0;font-size:clamp(30px,7vw,52px);font-weight:700;color:#3a2316;letter-spacing:.02em}
.fade-sub{margin:0;font-size:clamp(15px,3.5vw,20px);color:#8a5a34}
#pad{position:absolute;inset:auto 0 0 0;height:0}
#pov{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);padding:10px 14px 12px;display:grid;gap:8px;justify-items:center;z-index:2}
#pov p{margin:0;font-size:15px;color:var(--muted)}
#povCanvas{height:min(336px,52vh);width:auto;image-rendering:pixelated;border-radius:3px}
#end{position:absolute;inset:0;background:#ffffff;display:grid;place-items:center;overflow-y:auto;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  opacity:0;transition:opacity 1.4s ease}
#end.show{opacity:1}
.end-card{width:100%;max-width:420px;text-align:center;color:var(--ink);display:grid;gap:14px}
.end-kicker{margin:0;font-size:16px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.end-title{margin:0;font-size:clamp(28px,7vw,44px);line-height:1.05;text-wrap:balance}
.end-stats{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 18px;text-align:left;font-size:17px;
  padding:14px 18px;font-variant-numeric:tabular-nums}
.end-stats dt{color:var(--muted)}
.end-stats dd{margin:0;font-weight:700;text-align:right}
.end-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.end-badges span{background:var(--parchment);border:2px solid var(--wood);border-radius:3px;padding:1px 8px;font-size:14px}
#again{justify-self:center;font:700 18px var(--font-ui);color:var(--parchment);background:#4f8f3a;border:3px solid #2c5420;border-radius:4px;padding:8px 22px;cursor:pointer;box-shadow:0 4px 0 #2c5420}
#again:active{transform:translateY(2px);box-shadow:0 2px 0 #2c5420}
#again:focus-visible{outline:3px solid var(--wood);outline-offset:3px}
#stick{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  width:124px;height:124px;border-radius:50%;background:rgba(92,46,20,.55);border:3px solid rgba(212,137,63,.7);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--wood-light);border:3px solid var(--wood-dark);box-shadow:inset 0 4px 0 rgba(255,255,255,.3)}
#btnA{position:absolute;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));
  width:84px;height:84px;border-radius:50%;font:700 30px var(--font-ui);color:var(--parchment);background:#4f8f3a;border:4px solid #2c5420;box-shadow:0 0 0 3px #8cc46a,inset 0 5px 0 rgba(255,255,255,.25);touch-action:none}
#btnA:active{transform:translateY(2px)}
#btnA:focus-visible{outline:3px solid var(--parchment);outline-offset:4px}

@media (max-width:600px){
  #dlg{gap:10px}
  .dlg-text{min-height:110px;padding:10px 12px 22px}
  .dlg-text p{font-size:16px}
  .dlg-port{width:96px;padding:6px;gap:4px}
  #portrait{width:72px;height:72px}
  .nameplate{font-size:14px;padding:1px 6px}
  .role{font-size:11px}
  #hud{min-width:126px;padding:4px 9px 6px}
  .hud-time{font-size:20px}
  #hint{font-size:13px;max-width:calc(100% - 196px)}
}
@media (prefers-reduced-motion:reduce){.dlg-next{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div id="game" class="intro">
  <canvas id="view"></canvas>

  <div id="hud" class="frame" aria-live="off">
    <div class="hud-row"><span id="hDay">Wed. 11</span><span class="muted">Day 1</span></div>
    <div id="hTime" class="hud-time">9:00 am</div>
    <div class="focus"><span>Focus</span><div class="bar"><i id="hFocus"></i></div></div>
    <div class="hud-row"><span class="muted">Team met</span><span id="hMet" class="quest">0/12</span></div>
    <div class="hud-row"><span class="muted">Coffee</span><span id="hCoffee">0</span></div>
    <div class="hud-ver" data-version></div>
  </div>

  <div id="hint" class="frame"></div>

  <div id="caption" hidden><span class="cap-kicker" id="capKicker"></span><span class="cap-name" id="capName"></span><span class="cap-role" id="capRole"></span></div>
  <div id="titlecard" hidden><div class="tc-logo"><span>Office</span><span>Life</span></div><p class="tc-click">Click to start your first day</p><p class="tc-credit">Created by Sebastian (with a looooooooooooooot of AI)</p></div>
  <button id="skip" type="button" hidden>Skip to title »</button>
  <div id="start"><canvas id="city" width="320" height="180" aria-hidden="true"></canvas><button id="playBtn" type="button" aria-label="Play">Play</button></div>

  <div id="fade" aria-hidden="true">
    <p class="fade-day" id="fadeDay">Wednesday</p>
    <p class="fade-sub" id="fadeSub">Day 1 · Your first day on the team</p>
    <p class="fade-ver" data-version></p>
  </div>

  <div id="dlg" hidden>
    <div class="dlg-text frame"><p id="dlgText" aria-live="polite"></p><div class="choices" id="dlgChoices" hidden></div><span class="dlg-next" id="dlgNext" hidden></span></div>
    <div class="dlg-port frame" id="dlgPort">
      <canvas id="portrait" width="48" height="48"></canvas>
      <div class="nameplate" id="dlgName"></div>
      <div class="role" id="dlgRole"></div>
    </div>
  </div>

  <div id="pov" class="frame" hidden aria-label="What you see">
    <p>You peek over P. S.'s shoulder...</p>
    <canvas id="povCanvas" width="72" height="112"></canvas>
  </div>

  <div id="end" hidden>
    <div class="end-card">
      <p class="end-kicker" id="endKicker">End of Day 1</p>
      <h1 class="end-title" id="endTitle">Survived Day One</h1>
      <div class="end-badges" id="endBadges"></div>
      <dl class="end-stats frame" id="endStats"></dl>
      <button id="again" type="button">Play again</button>
      <p class="fade-ver" data-version></p>
    </div>
  </div>

  <div id="pad" hidden>
    <div id="stick"><i id="knob"></i></div>
    <button id="btnA" type="button" aria-label="Interact">A</button>
  </div>
</div>

<script>
(() => {
"use strict";
/* Bump this by one for every release */
const VERSION = 26;
document.querySelectorAll("[data-version]").forEach(el => { el.textContent = "Office Life v" + VERSION; });
const T = 16;

/* ---------- Map ----------
   Columns: 1-16 open office | 17 wall | 18-23 meeting room (top) + lounge (bottom) | 24 wall | 25-28 kitchen
   Legend: # wall, - wall face, w window, b sprint board, C clock, P poster
           . floor, , kitchen tile, M welcome mat, d desk, n your new desk, c chair, p plant, s server rack,
           k counter, m coffee machine, f fridge, x meeting table, y kitchen table, T ping pong, o sofa */
function row(a, c17, b, c24, k) {
  const s = "#" + a + c17 + b + c24 + k + "#";
  if (s.length !== 30) console.warn("Map row has wrong length:", s);
  return s;
}
const MAP = [
  "#".repeat(30),
  row("-ww-ww-bbb-ww-C-", "#", "ww-P-w", "#", "-ww-"),
  row("p..............p", "#", "p....p", "#", "kmkf"),
  row("................", "#", "..cc..", "#", ",,,,"),
  row(".dddd....dddd...", "#", ".cxxc.", ".", ",,,,"),
  row(".cccc....cccc...", "#", ".cxxc.", "#", ",yy,"),
  row("................", "#", "..cc..", "#", ",yy,"),
  row(".dddd....dddd...", ".", "......", "#", ",,,,"),
  row(".cccc....cccc...", "#", "......", "#", ",,,,"),
  row("................", "#", "p....p", "#", ",,,,"),
  row(".dddd....dddn...", "#", "......", "#", ",,,,"),
  row(".cccc....cccc...", "#", "####R#", "#", ",,,,"),
  row("................", "#", "......", "#", ",,,,"),
  row("...............p", "#", ".TTT..", "#", ",,,,"),
  row("ss..............", "#", ".TTT..", "#", ",,,,"),
  row("ss..............", ".", "......", ".", ",,,p"),
  row("................", "#", "......", "#", ",,,,"),
  row("p...............", "#", "p....p", "#", "oo,,"),
  row("pp....MMM.......", "#", "......", "#", ",,,,"),
  // south wall: glass G looks out over the other IT teams' floor (z), which you can't walk on
  row("GGGGG#####GGGGGG", "#", "GGGGGG", "#", "####"),
  "#" + "z".repeat(28) + "#",
  "#" + "z".repeat(28) + "#",
  "#".repeat(30),
];
const MW = 30, MH = MAP.length;
const WALLS = "#-wbCPRGz", OBJ = "dncpskmfxyTo";
const at = (c, r) => (r < 0 || r >= MH || c < 0 || c >= MW) ? "#" : MAP[r][c];
const isWall = ch => WALLS.includes(ch);
const isDesk = ch => ch === "d" || ch === "n";
const solid = ch => WALLS.includes(ch) || OBJ.includes(ch);
function hash(c, r) {
  let h = (c * 374761393 + r * 668265263) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  return "#" + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, "0")).join("");
}

/* ---------- Palette ---------- */
const C = {
  out: "#2a1d24", void: "#1d1820",
  carpetA: "#6f8190", carpetB: "#6a7b8a", carpetS: "#8297a6",
  meet: "#4d776f", meetS: "#5e8a81",
  woodA: "#b47c4a", woodB: "#a46f40", woodLine: "#8a5a33",
  tileA: "#e6dcc8", tileB: "#d3c5ab", grout: "#bcae93",
  wallTop: "#4a3a46", wallTopHi: "#5f4c5a", wallFace: "#e2cfa9", wallStripe: "#d8c39b", trim: "#c4a77c", base: "#8a6a4a",
  deskTop: "#c99059", deskHi: "#e0a96f", deskFront: "#8f5d34", deskDark: "#6e4426",
  chair: "#4a5d73", chairBack: "#34465a",
};

/* ---------- The team ----------
   look: style = short | long | buzz | curly | bald, beard = none | stache | full | stubble
   area: tiles the character wanders within (x0..x1, y0..y1) */
const TEAM = [
  { id: "sb", name: "S. B.", role: "Agile Team Lead", area: [4, 13, 2, 3],
    look: { skin: "#e8b48e", hair: "#3b2a20", style: "short", beard: "full", shirt: "#b5523c", collar: "#e9dccb" },
    repeat: [] },
  { id: "ps", name: "P. S.", role: "Product Owner", area: [19, 22, 7, 10],
    look: { skin: "#eebf98", hair: "#7d7468", style: "short", beard: "none", glasses: true, shirt: "#2f4066", collar: "#f0ece2" },
    intro: [
      { t: "Hi, I'm P. S., the product owner. I decide what we build, and in which order.", mood: "happy" },
      { t: "If you ever wonder why a ticket matters, come ask me. That's literally my job.", mood: "neutral" }],
    repeat: [
      [{ t: "The backlog is refined, prioritised, and only slightly terrifying.", mood: "smirk" }],
      [{ t: "Every story needs acceptance criteria. Our QA folks will make sure you remember that.", mood: "neutral" }],
      [{ t: "Ship small, learn fast. Then ship small again.", mood: "happy" }]] },
  { id: "aa", name: "A. A.", role: "Lead Front End Developer", area: [6, 12, 2, 3],
    look: { skin: "#c68a5e", hair: "#1f1816", style: "curly", beard: "stubble", shirt: "#6a4c9c", hoodie: true },
    intro: [
      { t: "Hey! A. A., lead front end. I keep the front end in one piece. Mostly.", mood: "smirk" },
      { t: "Your pull requests will come past me sooner or later. Small ones make me very happy.", mood: "happy" }],
    repeat: [
      [{ t: "Component first, page second. That's the rule.", mood: "neutral" }],
      [{ t: "If the linter complains, the linter is right. Usually.", mood: "smirk" }]] },
  { id: "ea", name: "E. A.", role: "Front End Developer", area: [1, 6, 6, 6],
    look: { skin: "#f1c6a2", hair: "#d8b25a", style: "short", beard: "none", glasses: true, shirt: "#e07a5f" },
    intro: [
      { t: "Hi, I'm E. A., front end developer. Welcome to the team!", mood: "happy" },
      { t: "Stuck getting the project running locally? Shout. Everyone gets stuck on day one.", mood: "neutral" }],
    repeat: [
      [{ t: "Hot reload is the greatest invention of our time.", mood: "happy" }],

const dlgEl = document.getElementById("dlg"), dlgText = document.getElementById("dlgText"),
      dlgNext = document.getElementById("dlgNext"), dlgPort = document.getElementById("dlgPort"),
      dlgName = document.getElementById("dlgName"), dlgRole = document.getElementById("dlgRole");
const dlgChoices = document.getElementById("dlgChoices");
const dlg = { open: false, lines: [], idx: 0, shown: 0, rendered: -1, onClose: null, sel: 0, choicesShown: false };
function renderChoices() {
  const l = dlg.lines[dlg.idx];
  dlgChoices.innerHTML = "";
  l.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice" + (i === dlg.sel ? " sel" : ""); b.textContent = c.label;
    b.addEventListener("click", ev => { ev.stopPropagation(); dlg.sel = i; pickChoice(); });
    dlgChoices.appendChild(b);
  });
  dlgChoices.hidden = false;
  dlg.choicesShown = true;
}
function moveChoice(d) {
  const l = dlg.lines[dlg.idx];
  dlg.sel = (dlg.sel + d + l.choices.length) % l.choices.length;
  [...dlgChoices.children].forEach((b, i) => b.classList.toggle("sel", i === dlg.sel));
}
function closeDialog() {
  dlg.open = false; dlgEl.hidden = true; talkingTo = null;
  dlgChoices.hidden = true; dlg.choicesShown = false;
  const cb = dlg.onClose; dlg.onClose = null;
  if (cb) cb();
}
function pickChoice() {
  const c = dlg.lines[dlg.idx].choices[dlg.sel];
  closeDialog();
  c.fn();
}
function openDialog(lines, onClose) {
  Object.assign(dlg, { open: true, lines, idx: 0, shown: 0, rendered: -1, onClose: onClose || null });
  dlgEl.hidden = false;
  showLine();
}
function showLine() {
  const l = dlg.lines[dlg.idx];
  if (l.who) {
    dlgPort.hidden = false;
    dlgName.textContent = l.who.name;
    dlgRole.textContent = l.who.role;
    drawPortrait(state.retro && l.who !== MAUI_WHO && l.who.name !== "You" ? retroize(l.who.look) : l.who.look, l.mood || "neutral");
  } else dlgPort.hidden = true;
  dlg.shown = 0; dlg.rendered = -1; dlg.sel = 0; dlg.choicesShown = false;
  dlgChoices.hidden = true;
}
function advance() {
  const l = dlg.lines[dlg.idx], len = l.t.length;
  if (dlg.shown < len) { dlg.shown = len; return; }
  if (l.choices) { if (dlg.choicesShown) pickChoice(); return; }
  dlg.idx++;
  if (dlg.idx >= dlg.lines.length) { closeDialog(); return; }
  showLine();
}
function updateDialog(dt) {
  const l = dlg.lines[dlg.idx];
  dlg.shown = Math.min(l.t.length, dlg.shown + dt * 48);
  const n = Math.floor(dlg.shown);
  if (n !== dlg.rendered) {
    dlg.rendered = n;
    dlgText.textContent = l.t.slice(0, n);
    dlgNext.hidden = n < l.t.length || !!l.choices;
    if (l.choices && n >= l.t.length && !dlg.choicesShown) renderChoices();
  }
}
dlgEl.addEventListener("click", () => { if (dlg.open) advance(); });

/* ---------- Movement & collision ---------- */
function blockedAt(x, y, self, ghost) {

  for (const [px, py] of pts) if (solid(at(Math.floor(px / T), Math.floor(py / T)))) return true;
  for (const o of chars) {
    if (o === self || o.gone || (ghost && o !== player)) continue;
    if (Math.abs(o.x - x) < 10 && Math.abs(o.y - y) < 6) return true;
  }
  return false;
}
function stepAnim(e, dt) {
  if (e.moving) { e.stepT += dt; if (e.stepT > 0.13) { e.stepT = 0; e.step++; } }
  else { e.step = 0; e.stepT = 0; }
}
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function facingTo(e, o) {
  const dx = o.x - e.x, dy = o.y - e.y;
  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
}
function updatePlayer(dt) {
  if (cut.phase !== "done") {
    player.moving = false;
    if (cut.phase === "fade" && cut.t > 0.7 && !cut.arrived) {
      const dy = cut.walk - player.y;
      if (Math.abs(dy) > 0.5) { player.y += Math.sign(dy) * Math.min(Math.abs(dy), 40 * dt); player.moving = true; player.dir = "up"; }
      else cut.arrived = true;
    }
    stepAnim(player, dt);
    return;
  }
  player.look = playerLook();
  if (player.jump) {
    const j = player.jump;
    j.t += dt;
    const k = Math.min(1, j.t / j.dur);
    player.x = j.sx + (j.tx - j.sx) * k;
    player.y = j.sy + (j.ty - j.sy) * k;
    player.lift = Math.sin(k * Math.PI) * j.h;
    player.moving = false;
    if (k >= 1) {
      player.lift = 0; player.jump = null;
      fx.shake = Math.max(fx.shake, 0.15);
      burst(6, player.x, player.y, { jitter: 10, angle: -Math.PI / 2, spread: 2.4, speed: [10, 30], life: [0.2, 0.4], size: [1, 1], colors: ["#d3c5ab", "#f7f3ea"], fade: true });
      if (j.done) j.done();
    }
    stepAnim(player, dt);
    return;
  }
  if (player.onTable) { player.moving = false; stepAnim(player, dt); return; }
  if (player.autoPath) {
    const [tx, ty] = player.autoPath[0];
    const dx = tx - player.x, dy = ty - player.y, sp = 70 * dt;
    if (Math.abs(dy) > 0.5) { player.y += Math.sign(dy) * Math.min(Math.abs(dy), sp); player.dir = dy < 0 ? "up" : "down"; player.moving = true; }
    else if (Math.abs(dx) > 0.5) { player.x += Math.sign(dx) * Math.min(Math.abs(dx), sp); player.dir = dx < 0 ? "left" : "right"; player.moving = true; }
    else {
      player.autoPath.shift();
      if (!player.autoPath.length) {
        player.autoPath = null; player.moving = false;
        const cb = player.autoDone; player.autoDone = null;
        if (cb) cb();
      }
    }
    stepAnim(player, dt);
    return;
  }
  if (player.seated) {
    player.moving = false; player.dir = "up";
    if (!dlg.open && !busy() && (keys.size || stickVec.x || stickVec.y)) tryStand();
    if (!whip.phase && !dlg.open) {
      player.typeT = (player.typeT || 0) - dt;
      if (player.typeT <= 0) { player.typeT = 1.4; floater("+" + (5 + Math.floor(Math.random() * 40)) + " LOC", player.x + 4, player.y - 26, "#9fe0a8"); }
    }
    stepAnim(player, dt);
    return;
  }
  if (busy()) { player.moving = false; stepAnim(player, dt); return; }
  let vx = (keys.has("r") ? 1 : 0) - (keys.has("l") ? 1 : 0);
  let vy = (keys.has("d") ? 1 : 0) - (keys.has("u") ? 1 : 0);
  if (stickVec.x || stickVec.y) { vx = stickVec.x; vy = stickVec.y; }
  else if (vx && vy) { vx *= Math.SQRT1_2; vy *= Math.SQRT1_2; }
  player.moving = !!(vx || vy) && !dlg.open;
  if (player.moving) {
    player.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? "left" : "right") : (vy < 0 ? "up" : "down");
    const sp = (state.golden ? 95 : state.sick > 0 ? 42 : 66) * dt;
    const nx = player.x + vx * sp;
    if (!blockedAt(nx, player.y, player)) player.x = nx;
    const ny = player.y + vy * sp;

  }
  stepAnim(player, dt);
  checkLeave();
}
function updateNpc(n, dt) {
  if (n.gone) {
    if (n.body && !n.look.robot && Math.random() < dt * 0.3) floater("z", n.x - 8, n.y - 12, "#dfe7f2");
    return;
  }
  if (state.vamp) {
    if (n === SD) { updateVamp(n, dt); return; }
    // everyone else freezes in terror and stares at the Count
    n.moving = false; n.path = null; n.target = null;
    if (!SD.gone) n.dir = facingTo(n, SD);
    stepAnim(n, dt); return;
  }
  if (n === SB && cut.phase !== "done" && !n.forced) { n.moving = false; stepAnim(n, dt); return; }
  if (n === SB && whip.phase && !n.forced) { n.moving = false; stepAnim(n, dt); return; }
  if (n.path && talkingTo !== n) { followPath(n, dt); return; }
  if (n.hop > 0) { n.hop = Math.max(0, n.hop - dt); n.lift = Math.sin((1 - n.hop / 0.45) * Math.PI) * 7; } else n.lift = 0;
  if (n.caught > 0) n.caught = Math.max(0, n.caught - dt);
  if (onPhone(n)) { n.moving = false; n.target = null; n.dir = "down"; stepAnim(n, dt); return; }
  const near = Math.hypot(player.x - n.x, player.y - n.y) < 26;
  if (talkingTo === n || (near && !n.forced)) {
    n.moving = false; n.target = null; n.wait = 1.5;
    n.dir = facingTo(n, player);
    stepAnim(n, dt); return;
  }
  if (dlg.open && !n.forced) { n.moving = false; stepAnim(n, dt); return; }
  if (state.standup && !n.target) { n.moving = false; n.dir = "down"; stepAnim(n, dt); return; }
  if (n.target) {
    const [tx, ty] = n.target;
    const dx = tx - n.x, dy = ty - n.y;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
      n.target = null; n.moving = false; n.forced = false; n.wait = 2 + Math.random() * 4; n.dir = "down";
    } else {
      const sp = (n.forced ? (n === SB && whip.phase ? 125 : 52) : 32) * dt;
      let nx = n.x, ny = n.y;
      if (Math.abs(dx) >= 1) { nx += Math.sign(dx) * Math.min(sp, Math.abs(dx)); n.dir = dx < 0 ? "left" : "right"; }
      else { ny += Math.sign(dy) * Math.min(sp, Math.abs(dy)); n.dir = dy < 0 ? "up" : "down"; }
      if (blockedAt(nx, ny, n, n.forced)) {
        n.moving = false;
        if (!n.forced) { n.target = null; n.wait = 1 + Math.random() * 2; }
      } else { n.x = nx; n.y = ny; n.moving = true; }
    }
  } else {
    n.moving = false;
    n.wait -= dt;
    if (n.wait <= 0) {
      if (Math.random() < 0.45) {
        n.dir = ["left", "right", "down", "up"][Math.floor(Math.random() * 4)];
        n.wait = 1.5 + Math.random() * 3;
      } else {
        const [x0, x1, y0, y1] = n.def.area;
        const tc = x0 + Math.floor(Math.random() * (x1 - x0 + 1)), tr = y0 + Math.floor(Math.random() * (y1 - y0 + 1));
        n.target = tileFeet(tc, tr);
      }
    }
  }
  stepAnim(n, dt);
}

/* ---------- Path finding (breadth-first search over floor tiles) ---------- */
function findPath(sc, sr, tc, tr) {
  const key = (c, r) => r * MW + c;
  const prev = new Map([[key(sc, sr), -1]]);
  const queue = [[sc, sr]];
  while (queue.length) {
    const [c, r] = queue.shift();
    if (c === tc && r === tr) {
      const out = [];
      let k = key(c, r);
      while (k !== -1) { out.unshift([k % MW, Math.floor(k / MW)]); k = prev.get(k); }
      return out;
    }
    for (const [dc, dr] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nc = c + dc, nr = r + dr, k = key(nc, nr);
      if (prev.has(k) || solid(at(nc, nr))) continue;
      prev.set(k, key(c, r));
      queue.push([nc, nr]);
    }
  }
  return null;
}
function sendNpc(n, tc, tr, done) {
  const sc = Math.floor(n.x / T), sr = Math.floor((n.y - 2) / T);
  const p = findPath(sc, sr, tc, tr);
  n.target = null;
  if (!p) { [n.x, n.y] = tileFeet(tc, tr); if (done) done(); return; }
  n.path = p.map(([c, r]) => tileFeet(c, r));
  n.forced = true; n.stuck = 0; n.pathDone = done || null;
}
function followPath(n, dt) {
  const [tx, ty] = n.path[0];
  const dx = tx - n.x, dy = ty - n.y;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
    n.x = tx; n.y = ty; n.path.shift();
    if (!n.path.length) {
      n.path = null; n.forced = false; n.moving = false; n.dir = "down"; n.wait = 2 + Math.random() * 3;
      const cb = n.pathDone; n.pathDone = null;
      if (cb) cb();
    }
  } else {
    const sp = (n.speed || 50) * dt;
    let nx = n.x, ny = n.y;
    if (Math.abs(dx) >= 1) { nx += Math.sign(dx) * Math.min(sp, Math.abs(dx)); n.dir = dx < 0 ? "left" : "right"; }
    else { ny += Math.sign(dy) * Math.min(sp, Math.abs(dy)); n.dir = dy < 0 ? "up" : "down"; }
    if (blockedAt(nx, ny, n, true)) {
      n.moving = false; n.stuck += dt;
      if (n.stuck > 2.5) { const last = n.path[n.path.length - 1]; n.x = last[0]; n.y = last[1]; n.path = [last]; n.stuck = 0; }
    } else { n.x = nx; n.y = ny; n.moving = true; n.stuck = 0; }
  }
  stepAnim(n, dt);
}

  const C2 = (x, y, w, h, c) => { cg.fillStyle = c; cg.fillRect(x, y, w, h); };

  cg.fillStyle = sky; cg.fillRect(0, 0, 320, 180);
  for (const st of CITY.stars) if (Math.sin(time * 2 + st.p) > -0.3) C2(st.x, st.y, 1, 1, "rgba(255,246,220,.85)");

  cg.fillStyle = "#f4ecd0"; for (let dy = -8; dy <= 8; dy++) { const w = Math.floor(Math.sqrt(64 - dy * dy)); cg.fillRect(268 - w, 26 + dy, w * 2 + 1, 1); }
  C2(264, 22, 3, 2, "#ddd2b0"); C2(271, 29, 2, 2, "#ddd2b0");
  // plane crossing
  const px = ((time * 14) % 400) - 40;
  C2(Math.floor(px), 36, 4, 1, "#6a5a7a");
  if (Math.floor(time * 2) % 2) C2(Math.floor(px) + 4, 36, 1, 1, "#ff6b6b");
  // far skyline
  for (const f of CITY.far) C2(f.x, CITY.GROUND - f.h, f.w, f.h, "#241d3a");
  // buildings
  const G = CITY.GROUND;
  for (const b of CITY.buildings) {
    const top = G - b.h;
    if (b.office) {
      C2(b.x - 1, top - 1, b.w + 2, b.h + 1, "#1a1424");
      C2(b.x, top, b.w, b.h, "#7a4a3c");
      for (let yy = top + 3; yy < G; yy += 6) C2(b.x, yy, b.w, 1, "#6a3f33");
      // lit office floors
      for (let wy = top + 10; wy < G - 12; wy += 9) for (let wx = b.x + 4; wx < b.x + b.w - 5; wx += 7) {
        const lit = ((wx * 7 + wy * 3) % 5) !== 0;
        C2(wx, wy, 5, 5, lit ? "#cfe8ff" : "#3a2e3a");
        if (lit) C2(wx, wy, 5, 1, "#ffffff");
      }
      // MAUI the cat sitting in one window
      const cx = b.x + 4 + 7 * 3, cy = top + 10 + 9 * 5;
      C2(cx + 1, cy + 2, 3, 3, "#2a2030"); C2(cx + 1, cy + 1, 1, 1, "#2a2030"); C2(cx + 3, cy + 1, 1, 1, "#2a2030");
      // entrance
      C2(b.x + b.w / 2 - 6, G - 10, 12, 10, "#f6d68a"); C2(b.x + b.w / 2 - 1, G - 10, 2, 10, "#7a4a3c");
      // neon rooftop sign
      const on = Math.sin(time * 3) > -0.85;
      C2(b.x + 6, top - 12, b.w - 12, 10, "#1a1424");

      cg.fillStyle = on ? "#ff9ad0" : "#6a3a5a";
      if (on) { cg.shadowColor = "#ff5fb0"; cg.shadowBlur = 6; }

      cg.shadowBlur = 0;
      C2(b.x + 10, top - 2, 1, 2, "#1a1424"); C2(b.x + b.w - 11, top - 2, 1, 2, "#1a1424");
      continue;
    }
    C2(b.x, top, b.w, b.h, b.col);
    C2(b.x, top, b.w, 1, "#4a4068");
    const rnd = mulberry(b.seed);
    for (let wy = top + 4; wy < G - 4; wy += 5) for (let wx = b.x + 2; wx < b.x + b.w - 2; wx += 4) {
      const r = rnd();
      let lit = r < 0.42;
      if (lit && Math.floor(time / 2 + r * 50) % 23 === 0) lit = false;
      C2(wx, wy, 2, 2, lit ? (r < 0.2 ? "#f6d68a" : "#ffe3b0") : "#463c64");
    }
    if (b.h > 95) { C2(b.x + b.w / 2, top - 6, 1, 6, "#2b2442"); if (Math.floor(time * 1.5) % 2) C2(b.x + b.w / 2, top - 7, 1, 1, "#ff6b6b"); }
  }
  // street, sidewalk and lamps
  C2(0, G, 320, 22, "#2a2530");
  C2(0, G, 320, 3, "#4a4258");
  for (let lx = 10; lx < 320; lx += 34) C2(lx, G + 12, 12, 1, "#6a6278");
  for (let lx = 22; lx < 320; lx += 52) {
    C2(lx, G - 14, 1, 14, "#1a1424"); C2(lx - 2, G - 15, 5, 2, "#1a1424");
    cg.fillStyle = "rgba(255,214,140,.18)"; cg.fillRect(lx - 6, G - 13, 13, 16);
    C2(lx - 1, G - 13, 3, 1, "#ffd68c");

}

const LEAD = [72, 72, 76, 79, null, 77, 76, 74,  72, null, 69, 72, 74, null, 76, null,

/* ---------- Sitcom opening: the sequence ---------- */
const intro = { on: false, i: -1, t: 0, ft: 0, frozen: false, zoom: 2.3, tint: "255,214,90", focus: { x: 0, y: 0 }, title: false };
const startEl = document.getElementById("start"), titleEl = document.getElementById("titlecard"), skipBtn = document.getElementById("skip");
const capEl = document.getElementById("caption");
const P_ = id => npcs.find(n => n.def.id === id);
const TINTS = ["255,214,90", "90,200,255", "255,120,180", "140,255,160", "200,150,255", "255,160,90"];
function put(e, c, r, dir) { [e.x, e.y] = tileFeet(c, r); e.dir = dir || "down"; e.moving = false; e.lift = 0; }
function walkTo(e, c, r, sp, dt) {
  const [tx, ty] = tileFeet(c, r), dx = tx - e.x, dy = ty - e.y;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) { e.x = tx; e.y = ty; e.moving = false; stepAnim(e, dt); return true; }

  else { e.y += Math.sign(dy) * Math.min(sp * dt, Math.abs(dy)); e.dir = dy < 0 ? "up" : "down"; }

}

function once(seg, key, fn) { if (!seg[key]) { seg[key] = true; fn(); } }
const focusOn = (e, dy = 0) => () => ({ x: e.x, y: e.y - 8 + dy });
function buildIntro() {
  const SBn = SB, PSn = P_("ps"), JOJ = P_("jjo"), MR = P_("mr"), SDn = P_("sd");
  const AA = P_("aa"), EA = P_("ea"), JG = P_("jg"), SK = P_("sk"), IR = P_("ir"), PW = P_("pw"), AW = P_("aw");
  return [
    { cap: ["", "S. B.", "as The Agile Team Lead"], dur: 2.4, focus: focusOn(SBn),
      setup() { put(SBn, 9, 3, "up"); },
      update(t, dt, sg) {
        if (t > 0.4) once(sg, "a", () => { floater("SHIP IT!", SBn.x, SBn.y - 34, "#ffd66b"); SBn.shout = 1.2; });
        if (t > 1.3) { SBn.dir = "down"; bounce(SBn, t, 1.4, 0.35, 5); }

    { cap: ["", "P. S.", "as The Product Owner"], dur: 2.6, focus: focusOn(PSn),
      setup() { put(PSn, 21, 8, "down"); PSn.hop = 0; PSn.caught = 0; },
      update(t, dt, sg) {
        if (t > 1.3) once(sg, "c", () => { PSn.hop = 0.45; PSn.caught = 1.6; });
        if (PSn.hop > 0) { PSn.hop = Math.max(0, PSn.hop - dt); PSn.lift = Math.sin((1 - PSn.hop / 0.45) * Math.PI) * 7; } else PSn.lift = 0;

    { cap: ["", "The Front End Team", "A. A. · E. A. · J. G. · S. K. · I. R. · P. W. · A. W."], dur: 3.0, zoom: 1.7,

// The whole cast laughing together; plays behind the title card
const GROUP = { zoom: 1.45, focus: () => ({ x: 9 * T + 8, y: 3 * T + 6 }),
  setup() {
    const others = npcs.filter(n => n !== SB).sort((a, b) => a.x - b.x);
    others.forEach((n, i) => put(n, STANDUP_SPOTS[i][0], STANDUP_SPOTS[i][1], "down"));

/* ---------- Loop ---------- */

    updateIntro(dt);
    if (!intro.frozen) { updateEffects(dt); updateFloaters(dt); updateOutsiders(dt); }
    if (intro.on) { const k = Math.min(1, dt * 6); camFX += (intro.focus.x - camFX) * k; camFY += (intro.focus.y - camFY) * k; }

window.claude?.hot?.snapshot(() => ({
