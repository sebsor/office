<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A Stardew-style pixel game set on an IT development floor.">
<meta name="theme-color" content="#1d1820">
<title>Commit Valley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
/* Layout: full-bleed pixel canvas with a camera that follows the player; wood-framed HUD and dialogue float on top */
:root{
  --ground:#1d1820;
  --wood-dark:#5c2e14;
  --wood:#8a4b22;
  --wood-light:#d4893f;
  --parchment:#f8e1ae;
  --parchment-2:#ebc583;
  --ink:#3a2316;
  --muted:#8a5a34;
  --focus:#4fb37a;
  --font-ui:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);overflow:hidden}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:var(--ground)}
#view{position:absolute;left:0;top:0;image-rendering:crisp-edges;image-rendering:pixelated}

.frame{
  background:linear-gradient(var(--parchment),var(--parchment-2));
  border:3px solid var(--wood);
  border-radius:4px;
  box-shadow:0 0 0 3px var(--wood-light),0 0 0 6px var(--wood-dark),0 8px 0 6px rgba(0,0,0,.35);
}

#hud{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));
  padding:6px 12px 8px;min-width:148px;display:grid;gap:3px;font-variant-numeric:tabular-nums}
.hud-row{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:600}
.hud-row .muted{color:var(--muted);font-weight:400}
.hud-time{font-size:24px;font-weight:700;line-height:1.05;text-align:center;border-block:2px solid rgba(138,75,34,.35);padding-block:2px}
.focus{display:flex;align-items:center;gap:8px;font-size:14px}
.bar{flex:1;height:9px;background:#5c2e14;border:2px solid var(--wood-dark);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--focus);box-shadow:inset 0 2px 0 rgba(255,255,255,.35);transition:width .3s}
.quest{color:#2f6239}
.hud-ver{font-size:12px;color:var(--muted);text-align:right;border-top:1px solid rgba(138,75,34,.3);padding-top:2px;letter-spacing:.04em}
.fade-ver{margin:0;font-size:13px;color:#b08a64;letter-spacing:.06em}
.quest.done{color:#4f8f3a}

#hint{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:calc(16px + env(safe-area-inset-left,0px));
  padding:6px 12px;font-size:15px;max-width:min(330px,calc(100% - 230px));line-height:1.3;transition:opacity .6s}
#hint b{font-weight:700}
#hint.gone{opacity:0;pointer-events:none}

#dlg{position:absolute;left:0;right:0;margin-inline:auto;width:min(900px,calc(100% - 40px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;gap:18px;align-items:stretch;cursor:pointer}
.touch #dlg{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.dlg-text{flex:1;min-width:0;min-height:128px;padding:14px 20px 26px;position:relative}
.dlg-text p{margin:0;font-size:21px;line-height:1.4;color:var(--ink)}
.dlg-next{position:absolute;right:14px;bottom:8px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--wood);animation:nudge .7s steps(2) infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.choices{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.choice{font:inherit;font-size:19px;text-align:left;background:transparent;border:0;border-radius:3px;padding:3px 10px 3px 26px;color:var(--ink);cursor:pointer;position:relative}
.choice:hover,.choice.sel{background:rgba(138,75,34,.16)}
.choice.sel::before{content:"";position:absolute;left:8px;top:50%;margin-top:-5px;border-left:9px solid var(--wood);border-top:5px solid transparent;border-bottom:5px solid transparent}
.choice:focus-visible{outline:2px solid var(--wood)}
.dlg-port{flex:0 0 auto;width:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px}
#portrait{width:120px;height:120px;image-rendering:pixelated;background:linear-gradient(#e0a868,#c98848);border:3px solid var(--wood);border-radius:2px}
.nameplate{background:var(--parchment);border:2px solid var(--wood);border-radius:3px;padding:1px 12px;font-weight:700;font-size:17px;text-align:center}
.role{font-size:13px;color:var(--muted);text-align:center;line-height:1.15}

#fade{position:absolute;inset:0;background:#ffffff;display:grid;place-content:center;text-align:center;gap:6px;pointer-events:none;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.fade-day{margin:0;font-size:clamp(30px,7vw,52px);font-weight:700;color:#3a2316;letter-spacing:.02em}
.fade-sub{margin:0;font-size:clamp(15px,3.5vw,20px);color:#8a5a34}
#pad{position:absolute;inset:auto 0 0 0;height:0}
#end{position:absolute;inset:0;background:#ffffff;display:grid;place-items:center;overflow-y:auto;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  opacity:0;transition:opacity 1.4s ease}
#end.show{opacity:1}
.end-card{width:100%;max-width:420px;text-align:center;color:var(--ink);display:grid;gap:14px}
.end-kicker{margin:0;font-size:16px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.end-title{margin:0;font-size:clamp(28px,7vw,44px);line-height:1.05;text-wrap:balance}
.end-stats{margin:0;display:grid;grid-template-columns:1fr auto;gap:6px 18px;text-align:left;font-size:17px;
  padding:14px 18px;font-variant-numeric:tabular-nums}
.end-stats dt{color:var(--muted)}
.end-stats dd{margin:0;font-weight:700;text-align:right}
.end-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.end-badges span{background:var(--parchment);border:2px solid var(--wood);border-radius:3px;padding:1px 8px;font-size:14px}
#again{justify-self:center;font:700 18px var(--font-ui);color:var(--parchment);background:#4f8f3a;border:3px solid #2c5420;border-radius:4px;padding:8px 22px;cursor:pointer;box-shadow:0 4px 0 #2c5420}
#again:active{transform:translateY(2px);box-shadow:0 2px 0 #2c5420}
#again:focus-visible{outline:3px solid var(--wood);outline-offset:3px}
#stick{position:absolute;left:calc(26px + env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  width:124px;height:124px;border-radius:50%;background:rgba(92,46,20,.55);border:3px solid rgba(212,137,63,.7);touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--wood-light);border:3px solid var(--wood-dark);box-shadow:inset 0 4px 0 rgba(255,255,255,.3)}
#btnA{position:absolute;right:calc(30px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));
  width:84px;height:84px;border-radius:50%;font:700 30px var(--font-ui);color:var(--parchment);background:#4f8f3a;border:4px solid #2c5420;box-shadow:0 0 0 3px #8cc46a,inset 0 5px 0 rgba(255,255,255,.25);touch-action:none}
#btnA:active{transform:translateY(2px)}
#btnA:focus-visible{outline:3px solid var(--parchment);outline-offset:4px}

@media (max-width:600px){
  #dlg{gap:10px}
  .dlg-text{min-height:110px;padding:10px 12px 22px}
  .dlg-text p{font-size:16px}
  .dlg-port{width:96px;padding:6px;gap:4px}
  #portrait{width:72px;height:72px}
  .nameplate{font-size:14px;padding:1px 6px}
  .role{font-size:11px}
  #hud{min-width:126px;padding:4px 9px 6px}
  .hud-time{font-size:20px}
  #hint{font-size:13px;max-width:calc(100% - 196px)}
}
@media (prefers-reduced-motion:reduce){.dlg-next{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="view"></canvas>

  <div id="hud" class="frame" aria-live="off">
    <div class="hud-row"><span id="hDay">Wed. 11</span><span class="muted">Day 1</span></div>
    <div id="hTime" class="hud-time">9:00 am</div>
    <div class="focus"><span>Focus</span><div class="bar"><i id="hFocus"></i></div></div>
    <div class="hud-row"><span class="muted">Team met</span><span id="hMet" class="quest">0/12</span></div>
    <div class="hud-row"><span class="muted">Coffee</span><span id="hCoffee">0</span></div>
    <div class="hud-ver" data-version></div>
  </div>

  <div id="hint" class="frame"></div>

  <div id="fade" aria-hidden="true">
    <p class="fade-day" id="fadeDay">Wednesday</p>
    <p class="fade-sub">Day 1 · Your first day on the team</p>
    <p class="fade-ver" data-version></p>
  </div>

  <div id="dlg" hidden>
    <div class="dlg-text frame"><p id="dlgText" aria-live="polite"></p><div class="choices" id="dlgChoices" hidden></div><span class="dlg-next" id="dlgNext" hidden></span></div>
    <div class="dlg-port frame" id="dlgPort">
      <canvas id="portrait" width="48" height="48"></canvas>
      <div class="nameplate" id="dlgName"></div>
      <div class="role" id="dlgRole"></div>
    </div>
  </div>

  <div id="end" hidden>
    <div class="end-card">
      <p class="end-kicker">End of Day 1</p>
      <h1 class="end-title" id="endTitle">Survived Day One</h1>
      <div class="end-badges" id="endBadges"></div>
      <dl class="end-stats frame" id="endStats"></dl>
      <button id="again" type="button">Play again</button>
      <p class="fade-ver" data-version></p>
    </div>
  </div>

  <div id="pad" hidden>
    <div id="stick"><i id="knob"></i></div>
    <button id="btnA" type="button" aria-label="Interact">A</button>
  </div>
</div>

<script>
(() => {
"use strict";
/* Bump this by one for every release */
const VERSION = 13;
document.querySelectorAll("[data-version]").forEach(el => { el.textContent = "Commit Valley v" + VERSION; });
const T = 16;

/* ---------- Map ----------
   Columns: 1-16 open office | 17 wall | 18-23 meeting room (top) + lounge (bottom) | 24 wall | 25-28 kitchen
   Legend: # wall, - wall face, w window, b sprint board, C clock, P poster
           . floor, , kitchen tile, M welcome mat, d desk, n your new desk, c chair, p plant, s server rack,
           k counter, m coffee machine, f fridge, x meeting table, y kitchen table, T ping pong, o sofa */
function row(a, c17, b, c24, k) {
  const s = "#" + a + c17 + b + c24 + k + "#";
  if (s.length !== 30) console.warn("Map row has wrong length:", s);
  return s;
}
const MAP = [
  "#".repeat(30),
  row("-ww-ww-bbb-ww-C-", "#", "ww-P-w", "#", "-ww-"),
  row("p..............p", "#", "p....p", "#", "kmkf"),
  row("................", "#", "..cc..", "#", ",,,,"),
  row(".dddd....dddd...", "#", ".cxxc.", ".", ",,,,"),
  row(".cccc....cccc...", "#", ".cxxc.", "#", ",yy,"),
  row("................", "#", "..cc..", "#", ",yy,"),
  row(".dddd....dddd...", ".", "......", "#", ",,,,"),
  row(".cccc....cccc...", "#", "......", "#", ",,,,"),
  row("................", "#", "p....p", "#", ",,,,"),
  row(".dddd....dddn...", "#", "......", "#", ",,,,"),
  row(".cccc....cccc...", "#", "####R#", "#", ",,,,"),
  row("................", "#", "......", "#", ",,,,"),
  row("...............p", "#", ".TTT..", "#", ",,,,"),
  row("ss..............", "#", ".TTT..", "#", ",,,,"),
  row("ss..............", ".", "......", ".", ",,,p"),
  row("................", "#", "......", "#", ",,,,"),
  row("p...............", "#", "p....p", "#", "oo,,"),
  row("pp....MMM.......", "#", "......", "#", ",,,,"),
  "#".repeat(30),
];
const MW = 30, MH = MAP.length;
const WALLS = "#-wbCPR", OBJ = "dncpskmfxyTo";
const at = (c, r) => (r < 0 || r >= MH || c < 0 || c >= MW) ? "#" : MAP[r][c];
const isWall = ch => WALLS.includes(ch);
const isDesk = ch => ch === "d" || ch === "n";
const solid = ch => WALLS.includes(ch) || OBJ.includes(ch);
function hash(c, r) {
  let h = (c * 374761393 + r * 668265263) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f)));
  return "#" + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, "0")).join("");
}

/* ---------- Palette ---------- */
const C = {
  out: "#2a1d24", void: "#1d1820",
  carpetA: "#6f8190", carpetB: "#6a7b8a", carpetS: "#8297a6",
  meet: "#4d776f", meetS: "#5e8a81",
  woodA: "#b47c4a", woodB: "#a46f40", woodLine: "#8a5a33",
  tileA: "#e6dcc8", tileB: "#d3c5ab", grout: "#bcae93",
  wallTop: "#4a3a46", wallTopHi: "#5f4c5a", wallFace: "#e2cfa9", wallStripe: "#d8c39b", trim: "#c4a77c", base: "#8a6a4a",
  deskTop: "#c99059", deskHi: "#e0a96f", deskFront: "#8f5d34", deskDark: "#6e4426",
  chair: "#4a5d73", chairBack: "#34465a",
};

/* ---------- The team ----------
   look: style = short | long | buzz | curly | bald, beard = none | stache | full | stubble
   area: tiles the character wanders within (x0..x1, y0..y1) */
const TEAM = [
  { id: "sb", name: "S. B.", role: "Agile Team Lead", area: [4, 13, 2, 3],
    look: { skin: "#e8b48e", hair: "#3b2a20", style: "short", beard: "full", shirt: "#b5523c", collar: "#e9dccb" },
    repeat: [] },
  { id: "ps", name: "P. S.", role: "Product Owner", area: [19, 22, 7, 10],
    look: { skin: "#eebf98", hair: "#7d7468", style: "short", beard: "none", glasses: true, shirt: "#2f4066", collar: "#f0ece2" },
    intro: [
      { t: "Hi, I'm P. S., the product owner. I decide what we build, and in which order.", mood: "happy" },
      { t: "If you ever wonder why a ticket matters, come ask me. That's literally my job.", mood: "neutral" }],
    repeat: [
      [{ t: "The backlog is refined, prioritised, and only slightly terrifying.", mood: "smirk" }],
      [{ t: "Every story needs acceptance criteria. Our QA folks will make sure you remember that.", mood: "neutral" }],
      [{ t: "Ship small, learn fast. Then ship small again.", mood: "happy" }]] },
  { id: "aa", name: "A. A.", role: "Lead Front End Developer", area: [6, 12, 2, 3],
    look: { skin: "#c68a5e", hair: "#1f1816", style: "curly", beard: "stubble", shirt: "#6a4c9c", hoodie: true },
    intro: [
      { t: "Hey! A. A., lead front end. I keep the front end in one piece. Mostly.", mood: "smirk" },
      { t: "Your pull requests will come past me sooner or later. Small ones make me very happy.", mood: "happy" }],
    repeat: [
      [{ t: "Component first, page second. That's the rule.", mood: "neutral" }],
      [{ t: "If the linter complains, the linter is right. Usually.", mood: "smirk" }]] },
  { id: "ea", name: "E. A.", role: "Front End Developer", area: [1, 6, 6, 6],
    look: { skin: "#f1c6a2", hair: "#d8b25a", style: "short", beard: "none", glasses: true, shirt: "#e07a5f" },
    intro: [
      { t: "Hi, I'm E. A., front end developer. Welcome to the team!", mood: "happy" },
      { t: "Stuck getting the project running locally? Shout. Everyone gets stuck on day one.", mood: "neutral" }],
    repeat: [
      [{ t: "Hot reload is the greatest invention of our time.", mood: "happy" }],
      [{ t: "CSS is easy, they said. Centre a div, they said.", mood: "smirk" }]] },
  { id: "ir", name: "I. R.", role: "Front End Developer · Remote", area: [10, 15, 6, 6],
    look: { skin: "#a8714a", hair: "#2a201a", style: "buzz", beard: "none", shirt: "#d9a43a", robot: true },
    intro: [
      { t: "Hey, I'm I. R., front end. Good to have you here. Well, good to have my robot here.", mood: "happy" },
      { t: "Pro tip: clear the cache before you report a bug. Ask me how I know.", mood: "smirk" }],
    repeat: [
      [{ t: "Every pixel matters. Some pixels matter more than others.", mood: "neutral" }],
      [{ t: "My browser has 47 tabs open. All of them are important.", mood: "smirk" }],
      [{ t: "Remote life: my commute is twelve steps and a coffee machine.", mood: "happy" }]] },
  { id: "jg", name: "J. G.", role: "Front End Developer", area: [1, 6, 9, 9],
    look: { skin: "#eab48c", hair: "#6b4226", style: "short", beard: "stache", shirt: "#3d6fb0" },
    intro: [
      { t: "Hello! J. G., front end developer. Nice to meet you.", mood: "happy" },
      { t: "First day tip: passwords go in the password manager. Not on a sticky note.", mood: "neutral" }],
    repeat: [
      [{ t: "Read the error message. Then read it again. It's usually telling the truth.", mood: "neutral" }],
      [{ t: "Friday afternoon is for refactoring. Not for deploying.", mood: "smirk" }]] },
  { id: "pw", name: "P. W.", role: "Front End Developer · Remote", area: [10, 15, 9, 9],
    look: { skin: "#f0c09a", hair: "#5a3a26", style: "curly", beard: "none", glasses: true, shirt: "#2f3a4a", hoodie: true, robot: true },
    intro: [
      { t: "Hi, P. W., front end. Welcome!", mood: "happy" },
      { t: "Pairing is the fastest way to learn the codebase. Grab any of us, any time.", mood: "neutral" }],
    repeat: [
      [{ t: "Naming things is the hardest part of this job.", mood: "neutral" }],
      [{ t: "It's not a bug if we call it a feature. QA disagrees.", mood: "smirk" }],
      [{ t: "This robot's battery lasts longer than my patience in long meetings.", mood: "smirk" }]] },
  { id: "aw", name: "A. W.", role: "Front End Developer · Remote", area: [10, 15, 13, 13],
    look: { skin: "#e9b896", hair: "#a0683a", style: "short", beard: "stubble", shirt: "#4a7fb0", robot: true },
    intro: [
      { t: "Hi! A. W., front end developer. Calling in from home today. Well, every day.", mood: "happy" },
      { t: "If my robot bumps into you, blame the Wi-Fi. Not me.", mood: "smirk" }],
    repeat: [
      [{ t: "Can you hear me? You're on mute. No wait, I'm on mute.", mood: "happy" }],
      [{ t: "My cat walked across the keyboard and approved a pull request. Kidding. Mostly.", mood: "smirk" }]] },
  { id: "sk", name: "S. K.", role: "Front End Developer", area: [1, 7, 12, 12],
    look: { skin: "#f3c9a8", hair: "#6a2f2a", style: "long", beard: "none", shirt: "#5aa0c8", lashes: true },
    intro: [
      { t: "Hi! I'm S. K., front end developer. Great to have you on the team.", mood: "happy" },
      { t: "Ask questions early. Nobody expects you to know everything on your first day.", mood: "neutral" }],
    repeat: [
      [{ t: "Mobile first, then everything else.", mood: "neutral" }],
      [{ t: "A good commit message is a gift to your future self.", mood: "happy" }]] },
  { id: "jjo", name: "J. J. O.", role: "Middleware Developer", area: [3, 6, 13, 16],
    look: { skin: "#ecb995", hair: "#b5562f", style: "bald", beard: "full", glasses: true, shirt: "#6b7380" },
    intro: [
      { t: "Hello, J. J. O., middleware. I connect the front end to everything behind it.", mood: "neutral" },
      { t: "When an API answers with something strange, come find me. I'm usually near the servers.", mood: "smirk" }],
    repeat: [
      [{ t: "The front end calls me, I call the back end, the back end calls... someone.", mood: "smirk" }],
      [{ t: "A timeout is just the system asking for patience.", mood: "neutral" }]] },
  { id: "mr", name: "M. R.", role: "QA", area: [25, 28, 8, 12],
    look: { skin: "#d9a07a", hair: "#1f1a1a", style: "short", beard: "none", glasses: true, shirt: "#a83a4a" },
    intro: [
      { t: "Hi, M. R., QA. Welcome to the team!", mood: "happy" },
      { t: "My job is to find the bugs before the customers do. Please don't take it personally.", mood: "smirk" }],
    repeat: [
      [{ t: "Steps to reproduce, expected result, actual result. In that order.", mood: "neutral" }],
      [{ t: "'Works on my machine' is not a test result.", mood: "smirk" }]] },
  { id: "sd", name: "S. D.", role: "QA", area: [18, 23, 15, 16],
    look: { skin: "#f0c4a0", hair: "#4a3226", style: "short", beard: "stubble", shirt: "#3a6e5a" },
    intro: [
      { t: "Hey! S. D., QA. Welcome aboard!", mood: "happy" },
      { t: "Between M. R. and me, nothing reaches production untested. Well, almost nothing.", mood: "smirk" }],
    repeat: [
      [{ t: "The automated tests run at night, so we don't have to.", mood: "happy" }],
      [{ t: "Edge cases are my favourite cases.", mood: "smirk" }]] },
];
const BYID = Object.fromEntries(TEAM.map(t => [t.id, t]));

/* ---------- Canvas setup ---------- */
const game = document.getElementById("game");
const cv = document.getElementById("view");
const g = cv.getContext("2d");
function resize() {
  const w = game.clientWidth, h = game.clientHeight;
  const s = Math.max(2, Math.round(Math.min(w / 320, h / 210)));
  cv.width = Math.ceil(w / s);
  cv.height = Math.ceil(h / s);
  cv.style.width = cv.width * s + "px";
  cv.style.height = cv.height * s + "px";
  g.imageSmoothingEnabled = false;
}
addEventListener("resize", resize);
resize();

const F = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
function disc(cx, cy, r, c) {
  g.fillStyle = c;
  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8));
    g.fillRect(cx - w, cy + dy, w * 2 + 1, 1);
  }
}
function pline(x0, y0, x1, y1, c) {
  g.fillStyle = c;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    g.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}
/* Sprite builder: "r" rects form the silhouette and get a dark outline, "d" rects are inner details */
function Spr() {
  const R = [], D = [];
  return {
    r(x, y, w, h, c) { R.push([x, y, w, h, c]); },
    d(x, y, w, h, c) { D.push([x, y, w, h, c]); },
    draw(ctx) {
      ctx.fillStyle = C.out;
      for (const [x, y, w, h] of R) ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      for (const [x, y, w, h, c] of R) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
      for (const [x, y, w, h, c] of D) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
    },
  };
}

const timers = [];

const busy = () => timers.length > 0 || !!player.autoPath || !!player.jump || player.onTable || fx.puke > 0 || fx.ascend > 0 || state.ended
  || whip.phase === "coming" || whip.phase === "escort" || whip.phase === "rush";
const whip = { phase: null, stuck: 0, next: 0 };
const floaters = [];
function floater(text, x, y, color) { floaters.push({ text, x, y, life: 1.3, color: color || "#f7f3ea" }); }
function walkPlayer(path, done) { player.autoPath = path.map(p => p.slice()); player.autoDone = done || null; }
const parts = [], decals = [];
const fx = { flash: 0, flashRGB: "255,255,255", shake: 0, puke: 0, sparkle: 0, smoke: 0, ascend: 0, screams: 0 };
function burst(n, x, y, o) {
  for (let i = 0; i < n; i++) {
    const a = (o.angle ?? Math.random() * Math.PI * 2) + (Math.random() - 0.5) * (o.spread ?? Math.PI * 2);
    const sp = o.speed[0] + Math.random() * (o.speed[1] - o.speed[0]);
    const life = o.life[0] + Math.random() * (o.life[1] - o.life[0]);
    parts.push({ x: x + (Math.random() - 0.5) * (o.jitter || 0), y: y + (Math.random() - 0.5) * (o.jitter || 0),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + (o.vy || 0), g: o.gravity || 0, life, max: life,
      size: o.size[0] + Math.floor(Math.random() * (o.size[1] - o.size[0] + 1)), color: o.colors[Math.floor(Math.random() * o.colors.length)], fade: !!o.fade });
  }
}
function updateEffects(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(i, 1);
  }
  fx.flash = Math.max(0, fx.flash - dt * 1.6);
  fx.shake = Math.max(0, fx.shake - dt);
  if (!dlg.open) for (let i = timers.length - 1; i >= 0; i--) {
    timers[i].t -= dt;
    if (timers[i].t <= 0) { const fn = timers[i].fn; timers.splice(i, 1); fn(); }
  }
  // smouldering server wreck
  if (state.serverDead) {
    fx.smoke -= dt;
    if (fx.smoke <= 0) {
      fx.smoke = 0.25 + Math.random() * 0.3;
      burst(1, 16 + Math.random() * 28, 14 * T - 4, { angle: -Math.PI / 2, spread: 0.6, speed: [8, 16], life: [1.5, 2.6], size: [2, 4], colors: ["#6b6670", "#857f8a", "#55505a"], fade: true });
      if (Math.random() < 0.35) burst(3, 16 + Math.random() * 28, 14 * T + 6, { angle: -Math.PI / 2, spread: 1.6, speed: [20, 50], gravity: 90, life: [0.3, 0.6], size: [1, 1], colors: ["#f2c46d", "#f28c28"] });
    }
  }
  // golden sparkle trail
  if (state.golden) {
    fx.sparkle -= dt;
    if (fx.sparkle <= 0) {
      fx.sparkle = player.moving ? 0.05 : 0.22;
      burst(1, player.x, player.y - 10, { jitter: 16, angle: -Math.PI / 2, spread: 0.8, speed: [6, 18], life: [0.5, 1], size: [1, 2], colors: ["#fff3b0", "#f2c94c", "#ffffff"], fade: true });
    }
  }
  // puke stream
  if (fx.puke > 0) {
    fx.puke -= dt;
    const [dx, dy] = DIRV[player.dir];
    const ang = Math.atan2(dy || 0.35, dx);
    burst(3, player.x + dx * 4, player.y - 16 + (dy > 0 ? 2 : 0), { angle: ang, spread: 0.5, speed: [40, 85], gravity: 160, life: [0.35, 0.6], size: [1, 2], colors: ["#b8c94a", "#d6d66a", "#9aa83a", "#e6e09a"] });
  }
  if (state.sick > 0 && !dlg.open) state.sick = Math.max(0, state.sick - dt);
}
function drawParticles() {
  for (const p of parts) {
    g.globalAlpha = p.fade ? Math.max(0, Math.min(1, p.life / p.max * 1.5)) : 1;
    F(Math.round(p.x), Math.round(p.y), p.size, p.size, p.color);

}

   fade: white screen fades out while you walk in from the door
   look: a short beat   notice: S. B. spots you, "!" pops   approach: he walks over   talk: welcome dialogue */
const cut = { phase: "fade", t: 0, walk: tileFeet(8, 16)[1], arrived: false };

function updateCutscene(dt) {
  if (cut.phase === "done") return;
  cut.t += dt;
  if (cut.phase === "fade") {
    fadeEl.style.opacity = Math.max(0, Math.min(1, 1 - (cut.t - 1.1) / 1.4));
    if (cut.t >= 2.5 && cut.arrived) { fadeEl.hidden = true; setPhase("look"); }
  } else if (cut.phase === "look") {

}

/* ---------- Floors & walls ---------- */
function floorStyle(c, r, ch) {
  if (ch === "," || c >= 24) return "tile";
  if (c >= 18 && c <= 23) return r < 11 ? "meet" : "wood";
  return "carpet";
}
function drawFloor(c, r, px, py, ch) {
  const st = floorStyle(c, r, ch), n = hash(c, r);
  if (st === "carpet") {
    F(px, py, T, T, (c + r) & 1 ? C.carpetA : C.carpetB);
    for (let i = 0; i < 3; i++) F(px + ((n >>> (i * 8)) & 15), py + ((n >>> (i * 8 + 4)) & 15), 1, 1, C.carpetS);
  } else if (st === "meet") {
    F(px, py, T, T, C.meet);
    F(px + 3, py + 3, 1, 1, C.meetS); F(px + 11, py + 11, 1, 1, C.meetS);
    F(px + 11, py + 3, 1, 1, C.meetS); F(px + 3, py + 11, 1, 1, C.meetS);
  } else if (st === "wood") {
    for (let i = 0; i < 4; i++) {
      F(px, py + i * 4, T, 4, (r * 4 + i) % 2 ? C.woodA : C.woodB);
      F(px, py + i * 4 + 3, T, 1, C.woodLine);
      const j = (hash(c, r * 4 + i) & 15);
      if (j < 8) F(px + j * 2, py + i * 4, 1, 3, C.woodLine);
    }
  } else {
    F(px, py, T, T, C.grout);
    F(px, py, 7, 7, C.tileA); F(px + 8, py + 8, 7, 7, C.tileA);
    F(px + 8, py, 7, 7, C.tileB); F(px, py + 8, 7, 7, C.tileB);
  }
  if (ch === "M") {
    const L = at(c - 1, r) === "M", R = at(c + 1, r) === "M";
    F(px, py + 2, T, 12, "#8a3b2e");
    F(px, py + 3, T, 10, "#b5523c");
    F(px, py + 2, T, 1, "#6a2a22"); F(px, py + 13, T, 1, "#6a2a22");
    if (!L) F(px + 1, py + 2, 1, 12, "#6a2a22");
    if (!R) F(px + 14, py + 2, 1, 12, "#6a2a22");
    if (L && R) { F(px + 3, py + 6, 10, 1, "#f2c46d"); F(px + 3, py + 9, 10, 1, "#f2c46d"); F(px + 7, py + 6, 2, 4, "#f2c46d"); }
  }
}
function drawWall(c, r, px, py, ch) {
  const below = at(c, r + 1), above = at(c, r - 1);
  const face = ch !== "#" || !isWall(below);
  if (!face) {
    F(px, py, T, T, C.wallTop);
    if (!isWall(at(c - 1, r))) F(px, py, 1, T, C.wallTopHi);
    if (!isWall(at(c + 1, r))) F(px + 15, py, 1, T, C.wallTopHi);
    return;
  }
  F(px, py, T, T, C.wallFace);
  F(px + 4, py, 1, T, C.wallStripe); F(px + 12, py, 1, T, C.wallStripe);
  let top = 0;
  if (!isWall(above)) { F(px, py, T, 4, C.wallTop); F(px, py + 3, T, 1, C.wallTopHi); top = 4; }
  F(px, py + top, T, 2, C.trim);
  F(px, py + 13, T, 3, C.base);
  F(px, py + 13, T, 1, "#a07c57");

  if (ch === "w") {
    F(px + 1, py + 2, 14, 11, "#f2e6cf");
    F(px + 2, py + 3, 12, 9, "#8fbcd6");
    F(px + 2, py + 3, 12, 3, "#a9d0e4");
    if (hash(c, 1) & 1) { F(px + 4, py + 5, 4, 1, "#f4f8fb"); F(px + 5, py + 4, 2, 1, "#f4f8fb"); }
    F(px + 7, py + 3, 2, 9, "#f2e6cf"); F(px + 2, py + 7, 12, 1, "#f2e6cf");
    F(px + 10, py + 9, 1, 1, "#d6ecf6"); F(px + 11, py + 8, 1, 1, "#d6ecf6");
    F(px + 1, py + 12, 14, 1, "#c9b48f");
  } else if (ch === "b" && at(c - 1, r) !== "b") {
    let n = 0; while (at(c + n, r) === "b") n++;
    const x = px + 1, y = py + 2, w = n * T - 2, h = 11;
    F(x - 1, y - 1, w + 2, h + 2, C.out);
    F(x, y, w, h, "#aeb6bf");
    F(x + 1, y + 1, w - 2, h - 2, "#f7f6f1");
    const notes = ["#f6d65b", "#f29bb0", "#8fd6e8", "#a8e07a"];
    const counts = [4, 3, 1];
    for (let k = 0; k < n; k++) {
      const cx = x + 1 + k * T;
      if (k > 0) F(cx - 1, y + 1, 1, h - 2, "#c9d0d6");
      F(cx + 2, y + 2, 9, 1, "#7d8792");
      for (let i = 0; i < (counts[k] ?? 1); i++) {
        F(cx + 2 + (i % 2) * 5, y + 4 + Math.floor(i / 2) * 3, 4, 2, notes[(k + i) % 4]);
      }
    }
    F(x + 2, y + h, w - 4, 1, "#8a929b");
  } else if (ch === "C") {
    disc(px + 8, py + 7, 5, C.out);
    disc(px + 8, py + 7, 4, "#f7f3ea");
    const m = state.minutes;
    const ma = ((m % 60) / 60) * Math.PI * 2, ha = (((m / 60) % 12) / 12) * Math.PI * 2;
    pline(px + 8, py + 7, Math.round(px + 8 + Math.sin(ma) * 3), Math.round(py + 7 - Math.cos(ma) * 3), C.out);
    pline(px + 8, py + 7, Math.round(px + 8 + Math.sin(ha) * 2), Math.round(py + 7 - Math.cos(ha) * 2), "#c0443b");
  } else if (ch === "R") {
    // mirror, with a tiny reflection when you stand in front of it
    F(px + 2, py + 1, 12, 12, C.out);
    F(px + 3, py + 2, 10, 10, "#c9d0d6");
    F(px + 4, py + 3, 8, 8, "#cfe3ea");
    F(px + 4, py + 3, 8, 3, "#dcecf1");
    const pc = Math.floor(player.x / T), pr = Math.floor((player.y - 2) / T);
    if (pc === c && pr === r + 1 && !player.seated) {

      F(px + 6, py + 8, 4, 3, L.shirt);
      F(px + 6, py + 5, 4, 3, L.skin);
      F(px + 6, py + 4, 4, 1, L.hair);
      if (L.style === "spiky") { F(px + 5, py + 3, 1, 2, L.hair); F(px + 7, py + 3, 1, 1, L.hair); F(px + 10, py + 3, 1, 2, L.hair); }
    }
    F(px + 5, py + 4, 1, 1, "#ffffff"); F(px + 6, py + 3, 1, 1, "#ffffff"); F(px + 10, py + 9, 1, 1, "#ffffff");
  } else if (ch === "P") {
    F(px + 3, py + 2, 10, 11, C.out);
    F(px + 4, py + 3, 8, 9, "#3d5a80");
    F(px + 9, py + 4, 2, 2, "#f2c46d");

  }
}

const dlgEl = document.getElementById("dlg"), dlgText = document.getElementById("dlgText"),
      dlgNext = document.getElementById("dlgNext"), dlgPort = document.getElementById("dlgPort"),
      dlgName = document.getElementById("dlgName"), dlgRole = document.getElementById("dlgRole");
const dlgChoices = document.getElementById("dlgChoices");
const dlg = { open: false, lines: [], idx: 0, shown: 0, rendered: -1, onClose: null, sel: 0, choicesShown: false };
function renderChoices() {
  const l = dlg.lines[dlg.idx];
  dlgChoices.innerHTML = "";
  l.choices.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "choice" + (i === dlg.sel ? " sel" : ""); b.textContent = c.label;
    b.addEventListener("click", ev => { ev.stopPropagation(); dlg.sel = i; pickChoice(); });
    dlgChoices.appendChild(b);
  });
  dlgChoices.hidden = false;
  dlg.choicesShown = true;
}
function moveChoice(d) {
  const l = dlg.lines[dlg.idx];
  dlg.sel = (dlg.sel + d + l.choices.length) % l.choices.length;
  [...dlgChoices.children].forEach((b, i) => b.classList.toggle("sel", i === dlg.sel));
}
function closeDialog() {
  dlg.open = false; dlgEl.hidden = true; talkingTo = null;
  dlgChoices.hidden = true; dlg.choicesShown = false;
  const cb = dlg.onClose; dlg.onClose = null;
  if (cb) cb();
}
function pickChoice() {
  const c = dlg.lines[dlg.idx].choices[dlg.sel];
  closeDialog();
  c.fn();
}
function openDialog(lines, onClose) {
  Object.assign(dlg, { open: true, lines, idx: 0, shown: 0, rendered: -1, onClose: onClose || null });
  dlgEl.hidden = false;
  showLine();
}
function showLine() {
  const l = dlg.lines[dlg.idx];
  if (l.who) {
    dlgPort.hidden = false;
    dlgName.textContent = l.who.name;
    dlgRole.textContent = l.who.role;
    drawPortrait(l.who.look, l.mood || "neutral");
  } else dlgPort.hidden = true;
  dlg.shown = 0; dlg.rendered = -1; dlg.sel = 0; dlg.choicesShown = false;
  dlgChoices.hidden = true;
}
function advance() {
  const l = dlg.lines[dlg.idx], len = l.t.length;
  if (dlg.shown < len) { dlg.shown = len; return; }
  if (l.choices) { if (dlg.choicesShown) pickChoice(); return; }
  dlg.idx++;
  if (dlg.idx >= dlg.lines.length) { closeDialog(); return; }
  showLine();
}
function updateDialog(dt) {
  const l = dlg.lines[dlg.idx];
  dlg.shown = Math.min(l.t.length, dlg.shown + dt * 48);
  const n = Math.floor(dlg.shown);
  if (n !== dlg.rendered) {
    dlg.rendered = n;
    dlgText.textContent = l.t.slice(0, n);
    dlgNext.hidden = n < l.t.length || !!l.choices;
    if (l.choices && n >= l.t.length && !dlg.choicesShown) renderChoices();
  }
}
dlgEl.addEventListener("click", () => { if (dlg.open) advance(); });

  }
  while (fx.screams < SCREAMS.length && t >= SCREAMS[fx.screams][0]) {
    floater(SCREAMS[fx.screams][1], player.x, player.y - 34 - fx.screams * 3, "#fff3b0");

const LEAVE_LINES = [

function checkLeave() {

const WHIP_SHOUTS = ["FASTER!", "TYPE!", "NO BREAKS!", "SHIP IT!", "MORE TICKETS!", "WRITE TESTS!", "FOCUS!"];
function updateWhip(dt) {
  if (SB.crack > 0) {
    SB.crack -= dt;
    if (!SB.crackHit && SB.crack < 0.3) {
      SB.crackHit = true;
      state.whips++;
      player.hurt = 0.35; fx.shake = Math.max(fx.shake, 0.3);
      floater(SB.crackWord, player.x, player.y - 30, "#ffd66b");

    whip.stuck += dt;

  }
  if (whip.phase === "rush") {
    whip.phase = "lecture";

      say(sb, "Did I say you could get up?", "angry"),
      say(sb, "You sit. You type. Until five o'clock.", "angry"),
    ], () => { whip.phase = "guard"; whip.next = 1.5; }));

      say(sb, "Oh no you don't. It's not five o'clock yet.", "angry"),
      say(sb, "BACK. TO. YOUR. DESK.", "angry"),
    ], () => {

  } else if (whip.phase === "escort" || whip.phase === "guard") {
    if (whip.phase === "guard" && !SB.target) SB.dir = "left";

    if (whip.next <= 0 && SB.crack <= 0) {

let stickVec = { x: 0, y: 0 }, stickId = null;

function moveStick(e) {

/* ---------- Movement & collision ---------- */
function blockedAt(x, y, self, ghost) {
  const pts = [[x - 5, y - 5], [x + 4, y - 5], [x - 5, y - 1], [x + 4, y - 1]];
  for (const [px, py] of pts) if (solid(at(Math.floor(px / T), Math.floor(py / T)))) return true;
  for (const o of chars) {
    if (o === self || (ghost && o !== player)) continue;
    if (Math.abs(o.x - x) < 10 && Math.abs(o.y - y) < 6) return true;
  }
  return false;
}
function stepAnim(e, dt) {
  if (e.moving) { e.stepT += dt; if (e.stepT > 0.13) { e.stepT = 0; e.step++; } }
  else { e.step = 0; e.stepT = 0; }
}
const DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function facingTo(e, o) {
  const dx = o.x - e.x, dy = o.y - e.y;
  return Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down");
}
function updatePlayer(dt) {
  if (cut.phase !== "done") {
    player.moving = false;
    if (cut.phase === "fade" && cut.t > 0.7 && !cut.arrived) {
      const dy = cut.walk - player.y;
      if (Math.abs(dy) > 0.5) { player.y += Math.sign(dy) * Math.min(Math.abs(dy), 40 * dt); player.moving = true; player.dir = "up"; }
      else cut.arrived = true;
    }
    stepAnim(player, dt);
    return;
  }
  player.look = playerLook();
  if (player.jump) {
    const j = player.jump;
    j.t += dt;
    const k = Math.min(1, j.t / j.dur);
    player.x = j.sx + (j.tx - j.sx) * k;
    player.y = j.sy + (j.ty - j.sy) * k;
    player.lift = Math.sin(k * Math.PI) * j.h;
    player.moving = false;
    if (k >= 1) {
      player.lift = 0; player.jump = null;
      fx.shake = Math.max(fx.shake, 0.15);
      burst(6, player.x, player.y, { jitter: 10, angle: -Math.PI / 2, spread: 2.4, speed: [10, 30], life: [0.2, 0.4], size: [1, 1], colors: ["#d3c5ab", "#f7f3ea"], fade: true });
      if (j.done) j.done();
    }
    stepAnim(player, dt);
    return;
  }
  if (player.onTable) { player.moving = false; stepAnim(player, dt); return; }
  if (player.autoPath) {
    const [tx, ty] = player.autoPath[0];
    const dx = tx - player.x, dy = ty - player.y, sp = 70 * dt;
    if (Math.abs(dy) > 0.5) { player.y += Math.sign(dy) * Math.min(Math.abs(dy), sp); player.dir = dy < 0 ? "up" : "down"; player.moving = true; }
    else if (Math.abs(dx) > 0.5) { player.x += Math.sign(dx) * Math.min(Math.abs(dx), sp); player.dir = dx < 0 ? "left" : "right"; player.moving = true; }
    else {
      player.autoPath.shift();
      if (!player.autoPath.length) {
        player.autoPath = null; player.moving = false;
        const cb = player.autoDone; player.autoDone = null;
        if (cb) cb();
      }
    }
    stepAnim(player, dt);
    return;
  }
  if (player.seated) {
    player.moving = false; player.dir = "up";
    if (!dlg.open && !busy() && (keys.size || stickVec.x || stickVec.y)) tryStand();
    if (!whip.phase && !dlg.open) {
      player.typeT = (player.typeT || 0) - dt;
      if (player.typeT <= 0) { player.typeT = 1.4; floater("+" + (5 + Math.floor(Math.random() * 40)) + " LOC", player.x + 4, player.y - 26, "#9fe0a8"); }
    }
    stepAnim(player, dt);
    return;
  }
  if (busy()) { player.moving = false; stepAnim(player, dt); return; }
  let vx = (keys.has("r") ? 1 : 0) - (keys.has("l") ? 1 : 0);
  let vy = (keys.has("d") ? 1 : 0) - (keys.has("u") ? 1 : 0);
  if (stickVec.x || stickVec.y) { vx = stickVec.x; vy = stickVec.y; }
  else if (vx && vy) { vx *= Math.SQRT1_2; vy *= Math.SQRT1_2; }
  player.moving = !!(vx || vy) && !dlg.open;
  if (player.moving) {
    player.dir = Math.abs(vx) > Math.abs(vy) ? (vx < 0 ? "left" : "right") : (vy < 0 ? "up" : "down");
    const sp = (state.golden ? 95 : state.sick > 0 ? 42 : 66) * dt;
    const nx = player.x + vx * sp;
    if (!blockedAt(nx, player.y, player)) player.x = nx;
    const ny = player.y + vy * sp;
    if (!blockedAt(player.x, ny, player)) player.y = ny;
  }
  stepAnim(player, dt);
  checkLeave();
}
function updateNpc(n, dt) {
  if (n === SB && cut.phase !== "done" && !n.forced) { n.moving = false; stepAnim(n, dt); return; }
  if (n === SB && whip.phase && !n.forced) { n.moving = false; stepAnim(n, dt); return; }
  const near = Math.hypot(player.x - n.x, player.y - n.y) < 26;
  if (talkingTo === n || (near && !n.forced)) {
    n.moving = false; n.target = null; n.wait = 1.5;
    n.dir = facingTo(n, player);
    stepAnim(n, dt); return;
  }
  if (dlg.open && !n.forced) { n.moving = false; stepAnim(n, dt); return; }
  if (n.target) {
    const [tx, ty] = n.target;
    const dx = tx - n.x, dy = ty - n.y;
    if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
      n.target = null; n.moving = false; n.forced = false; n.wait = 2 + Math.random() * 4; n.dir = "down";
    } else {
      const sp = (n.forced ? (n === SB && whip.phase ? 125 : 52) : 32) * dt;
      let nx = n.x, ny = n.y;
      if (Math.abs(dx) >= 1) { nx += Math.sign(dx) * Math.min(sp, Math.abs(dx)); n.dir = dx < 0 ? "left" : "right"; }
      else { ny += Math.sign(dy) * Math.min(sp, Math.abs(dy)); n.dir = dy < 0 ? "up" : "down"; }
      if (blockedAt(nx, ny, n, n.forced)) {
        n.moving = false;
        if (!n.forced) { n.target = null; n.wait = 1 + Math.random() * 2; }
      } else { n.x = nx; n.y = ny; n.moving = true; }
    }
  } else {
    n.moving = false;
    n.wait -= dt;
    if (n.wait <= 0) {
      if (Math.random() < 0.45) {
        n.dir = ["left", "right", "down", "up"][Math.floor(Math.random() * 4)];
        n.wait = 1.5 + Math.random() * 3;
      } else {
        const [x0, x1, y0, y1] = n.def.area;
        const tc = x0 + Math.floor(Math.random() * (x1 - x0 + 1)), tr = y0 + Math.floor(Math.random() * (y1 - y0 + 1));
        n.target = tileFeet(tc, tr);
      }
    }
  }
  stepAnim(n, dt);
}

function interact() {
  if (dlg.open) { advance(); return; }
  if (cut.phase !== "done" || busy()) return;
  if (player.seated) { tryStand(); return; }
  const [dx, dy] = DIRV[player.dir];
  const fx = player.x + dx * 12, fy = player.y - 3 + dy * 12;
  let best = null, bd = 13;
  for (const n of npcs) {
    const d = Math.hypot(fx - n.x, fy - (n.y - 3));
    if (d < bd) { bd = d; best = n; }
  }
  if (best) {
    state.serverPokes = 0;
    talkingTo = best;
    best.dir = facingTo(best, player);
    openDialog(npcLines(best), () => updateHud());
    return;
  }
  const ch = at(Math.floor(fx / T), Math.floor(fy / T));
  if (ch !== "s") state.serverPokes = 0;
  if (ch === "s") {
    if (state.serverDead) return openDialog([{ t: "What's left of the server rack. It smells like burnt toast and regret." }]);
    state.serverPokes++;
    if (state.serverPokes === 1) return openDialog([{ t: INFO.s[0] }]);
    if (state.serverPokes === 2) return openDialog([{ t: "You poke the server again. The amber light blinks faster. A fan spins up to a very worrying pitch." }]);
    return explodeServer();
  }
  if (ch === "f") {
    if (state.yogurtEaten) return openDialog([{ t: "The yogurt shelf is empty. The fridge seems relieved." }]);
    return openDialog([{ t: "A yogurt labelled DO NOT EAT. It expired in March. The lid is bulging slightly.", choices: [
      { label: "Eat it", fn: eatYogurt },
      { label: "Put it back", fn: () => openDialog([{ t: "You put it back. Wise. Very wise." }]) },
    ] }]);
  }
  if (ch === "m") return brewCoffee();
  if (ch === "R") return lookInMirror();
  const tc = Math.floor(fx / T), tr = Math.floor(fy / T);
  if (ch === "n" || (ch === "c" && tc === 13 && tr === 11)) { state.serverPokes = 0; return sit(); }
  const pool = INFO[ch];
  if (pool) openDialog([{ t: pool[Math.floor(Math.random() * pool.length)] }]);
}
function startIntro() {
  if (state.introDone) return;

const hTime = document.getElementById("hTime"), hFocus = document.getElementById("hFocus"),
      hCoffee = document.getElementById("hCoffee"), hMet = document.getElementById("hMet");
(() => {

  document.getElementById("hDay").textContent = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][d.getDay()] + ". " + d.getDate();

function fmtTime(m) {
  const h24 = Math.floor(m / 60) % 24, mm = m % 60;
  const h = ((h24 + 11) % 12) + 1;
  return `${h}:${String(mm).padStart(2, "0")} ${h24 < 12 ? "am" : "pm"}`;
}
function updateHud() {
  hTime.textContent = fmtTime(state.minutes);
  hFocus.style.width = state.focus + "%";
  hFocus.style.background = state.golden ? "linear-gradient(90deg,#f2c94c,#fff3b0,#f2c94c)" : state.focus < 25 ? "#d9634f" : state.focus < 50 ? "#e2b33f" : "";
  hCoffee.textContent = state.coffees;
  hMet.textContent = `${metCount()}/${TOTAL}`;
  hMet.classList.toggle("done", metCount() >= TOTAL);
}
function updateTime(dt) {
  if (dlg.open || state.ended) return;
  const tick = player.seated ? 0.5 : 7;
  state.tickAcc += dt;
  while (state.tickAcc >= tick) {
    state.tickAcc -= tick;
    state.minutes += 10;
    if (!state.golden) state.focus = Math.max(0, state.focus - 1.5);
    updateHud();
    if (state.minutes >= 17 * 60 && !state.fiveDone) { state.tickAcc = 0; fiveOClock(); break; }
  }
}

/* ---------- Render ---------- */
function render(time) {
  const vw = cv.width, vh = cv.height, WW = MW * T, WH = MH * T;
  let camX = camFX - vw / 2, camY = camFY - 10 - vh / 2;
  const cx = WW <= vw ? (WW - vw) / 2 : Math.max(0, Math.min(WW - vw, camX));
  const cy = WH <= vh ? (WH - vh) / 2 : Math.max(0, Math.min(WH - vh, camY));
  camX = camX + (cx - camX) * camClamp;
  camY = camY + (cy - camY) * camClamp;
  if (fx.shake > 0) { const m = Math.min(1, fx.shake) * 3; camX += (Math.random() - 0.5) * m * 2; camY += (Math.random() - 0.5) * m * 2; }
  camX = Math.round(camX); camY = Math.round(camY);

  g.setTransform(1, 0, 0, 1, 0, 0);
  F(0, 0, vw, vh, C.void);
  g.setTransform(1, 0, 0, 1, -camX, -camY);

  const c0 = Math.max(0, Math.floor(camX / T) - 2), c1 = Math.min(MW - 1, Math.ceil((camX + vw) / T) + 1);
  const r0 = Math.max(0, Math.floor(camY / T) - 2), r1 = Math.min(MH - 1, Math.ceil((camY + vh) / T) + 2);

  const list = [];
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const ch = at(c, r), px = c * T, py = r * T;
    if (isWall(ch)) drawWall(c, r, px, py, ch);
    else {
      drawFloor(c, r, px, py, ch);
      if (OBJ.includes(ch)) {
        if (ch === "s") {
          if (at(c - 1, r) !== "s" && at(c, r - 1) !== "s") list.push({ k: (r + 2) * T, f: () => drawObject(ch, c, r, px, py, time) });
        } else list.push({ k: (r + 1) * T - (ch === "c" ? 2 : 0), f: () => drawObject(ch, c, r, px, py, time) });
      }
    }
  }
  for (const d of decals) drawPuddle(d);
  for (const e of chars) list.push({ k: e === player && (player.onTable || player.jump) ? 1e6 : e.y, f: () => {
    const lift = e === player ? Math.round(player.lift || 0) : 0;
    if (lift) { F(Math.round(e.x) - 5, Math.round(e.y) - 1, 10, 2, "rgba(20,10,20,.25)"); e.y -= lift; }
    if (e === player && (state.golden || (fx.ascend > 1.1 && Math.floor(time * 14) % 2 === 0))) drawAura(e, time, fx.ascend > 0 ? 1.4 : 1);
    if (e === player && player.hurt > 0) {
      const ox = Math.random() < 0.5 ? -1 : 1, x0 = e.x;
      e.x += ox; drawPerson(e); e.x = x0;
    } else drawPerson(e);
    if (lift) e.y += lift;
  } });
  list.sort((a, b) => a.k - b.k);
  for (const it of list) it.f();
  drawParticles();
  if (SB.crack > 0) drawWhip();
  drawFloaters();
  if (SB.shout > 0) drawNotice(SB.x, SB.y - 30, 2 - SB.shout);

  // markers: speech bubble for whoever is in range, yellow "!" over people you haven't met
  let near = null, nd = 30;
  for (const n of npcs) { const d = Math.hypot(player.x - n.x, player.y - n.y); if (d < nd) { nd = d; near = n; } }
  if (cut.phase === "notice") drawNotice(SB.x, SB.y - 30, cut.t);
  if (fx.flash > 0) { g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = `rgba(${fx.flashRGB},${fx.flash})`; g.fillRect(0, 0, vw, vh); g.setTransform(1, 0, 0, 1, -camX, -camY); }
  for (const n of npcs) {
    if (dlg.open || cut.phase !== "done") break;
    const top = n.y - (n.look.robot ? 39 : 30);
    if (n === near) drawBubble(n.x, top);
    else if (!state.met.includes(n.def.id)) drawExclaim(n.x, top);
  }
}

/* ---------- Loop ---------- */
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  updateCutscene(dt);
  updateEffects(dt);
  updateAscend(dt);
  updateWhip(dt);
  updateFloaters(dt);
  if (SB.shout > 0) SB.shout = Math.max(0, SB.shout - dt);
  updatePlayer(dt);
  for (const n of npcs) updateNpc(n, dt);
  const wantClamp = player.onTable || player.jump ? 0 : 1;
  camClamp += (wantClamp - camClamp) * Math.min(1, dt * 2.5);
  const f = camFocus(), k = Math.min(1, dt * 3.2);
  camFX += (f.x - camFX) * k; camFY += (f.y - camFY) * k;
  updateTime(dt);
  if (dlg.open) updateDialog(dt);
  render(t / 1000);
  requestAnimationFrame(loop);
}

window.claude?.hot?.snapshot(() => ({
  player: { x: player.x, y: player.y, dir: player.dir },
  npcs: npcs.map(n => ({ x: n.x, y: n.y, dir: n.dir })),
  state: { ...state },
}));
function start(data) {
  if (data && data.player) Object.assign(player, data.player);
  if (data && data.npcs) data.npcs.forEach((p, i) => npcs[i] && Object.assign(npcs[i], p));
  if (data && data.state) Object.assign(state, data.state);
  updateHud();
  requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
  if (state.introDone) { setPhase("done"); fadeEl.hidden = true; showHint(); }
  camFX = player.x; camFY = player.y;
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
